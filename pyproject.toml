[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qa-ai-agents"
version = "0.1.0"
description = "Ten Claude-powered agents for everyday QA work: requirements, test design, API contracts, code review, failure triage, flaky tests, defects, regression selection, reporting and release readiness."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Awais Ashraf" }]
dependencies = [
  "anthropic>=2.3",
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
qa-agents = "qa_agents.cli:main"

[tool.setuptools.packages.find]
include = ["qa_agents*"]

[tool.setuptools.package-data]
qa_agents = ["demo/*.json", "knowledge/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
