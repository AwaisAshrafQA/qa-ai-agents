name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Run every agent on the examples (demo mode, no API key)
        run: qa-agents example all --demo --out reports
      - uses: actions/upload-artifact@v4
        with:
          name: sample-reports-py${{ matrix.python-version }}
          path: reports/
